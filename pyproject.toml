[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "muse-bridge-cli"
version = "0.3.0"
description = "Muse CLI for muse.ai: Keychain login, read-only MCP, and a bidirectional Codex/Claude task bridge"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
keywords = ["muse", "muse-ai", "muse-cli", "codex", "claude-code", "mcp", "cli", "agent", "macos"]
classifiers = ["Development Status :: 4 - Beta", "Environment :: Console", "Operating System :: MacOS", "Programming Language :: Python :: 3", "Topic :: Software Development"]

dependencies = ["cryptography>=46,<51", "curl-cffi>=0.13,<0.15", "noiseprotocol>=0.3.1,<0.4", "keyring>=25.6,<26", "playwright>=1.55,<2"]

[project.urls]
Homepage = "https://buzhidaosm.github.io/muse-cli-bridge/"
Repository = "https://github.com/buzhidaosm/muse-cli-bridge"
Documentation = "https://github.com/buzhidaosm/muse-cli-bridge#readme"
Issues = "https://github.com/buzhidaosm/muse-cli-bridge/issues"
Changelog = "https://github.com/buzhidaosm/muse-cli-bridge/blob/main/CHANGELOG.md"


[project.scripts]
muse-bridge = "musebridge.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.13,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/musebridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
