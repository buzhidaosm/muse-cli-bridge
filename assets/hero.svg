<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
<title id="title">Muse Bridge — Muse CLI for Codex and Claude Code</title>
<desc id="desc">Your Muse personal agent sends a task to your Mac. Codex or Claude Code runs it and the result returns to the same Muse chat.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101c25"/><stop offset="1" stop-color="#152c34"/></linearGradient></defs>
<rect width="1280" height="640" rx="24" fill="url(#bg)"/>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
<text x="72" y="106" font-size="19" letter-spacing="3" fill="#91f4c8">OPEN SOURCE · macOS</text>
<text x="68" y="199" font-size="76" font-weight="700" fill="#f3f8f7">Muse Bridge</text>
<text x="72" y="255" font-size="29" fill="#b7cccf">Muse CLI for Codex &amp; Claude Code</text>
<g font-size="23" font-weight="600" fill="#f3f8f7">
<rect x="72" y="326" width="258" height="102" rx="14" fill="#203540" stroke="#45616a"/><text x="103" y="384">Your Muse agent</text>
<rect x="468" y="326" width="268" height="102" rx="14" fill="#203540" stroke="#91f4c8"/><text x="500" y="371">Your Mac</text><text x="500" y="402" font-size="17" fill="#b7cccf">local task relay</text>
<rect x="872" y="326" width="336" height="102" rx="14" fill="#203540" stroke="#45616a"/><text x="904" y="371">Codex / Claude Code</text><text x="904" y="402" font-size="17" fill="#b7cccf">bounded CLI tasks</text>
</g>
<g stroke="#91f4c8" stroke-width="3" fill="none"><path d="M346 377H445m-12-10 12 10-12 10"/><path d="M752 377H849m-12-10 12 10-12 10"/><path d="M1040 443V479H200V443m-10 12 10-12 10 12"/></g>
<text x="511" y="512" font-size="18" fill="#91f4c8">result back in the same chat</text>
<text x="72" y="577" font-size="20" fill="#b7cccf">Keychain login · explicit project scope · read-only MCP · no public ports</text>
</g></svg>
